# Disposable authentik for integration tests: pnpm test:integration
# Never use these credentials outside local testing.
services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: authentik-test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 5s
      retries: 20
    tmpfs: /var/lib/postgresql/data

  server:
    image: ghcr.io/goauthentik/server:2026.8.4
    command: server
    environment: &authentik-env
      AUTHENTIK_SECRET_KEY: integration-tests-only-secret-key-0123456789
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: authentik-test
      AUTHENTIK_BOOTSTRAP_PASSWORD: integration-admin-password
      AUTHENTIK_BOOTSTRAP_TOKEN: integration-bootstrap-token-0123456789abcdef
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@example.test
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    ports:
      - "9000:9000"
    depends_on:
      postgresql:
        condition: service_healthy

  worker:
    image: ghcr.io/goauthentik/server:2026.8.4
    command: worker
    environment: *authentik-env
    depends_on:
      postgresql:
        condition: service_healthy
